# Builds Zorbash's terminal edition for the Asciiverse catalog and as system
# packages.
#
# For av: one archive per target, named zorbash-<target>.tar.gz (.zip on
# Windows), plus a SHA256SUMS file, attached to a GitHub release
# (hub/catalog/SCHEMA.md, release.source = "github"). Each archive holds the
# one binary (all the game's pictures, sounds and music are built in), the
# licence, readme, PATCHES.md and UPSTREAM.md.
# For everyone else: .deb, .rpm and Arch packages from the same Linux build,
# made by nfpm (asciiverse/nfpm.yaml).
#
# Tags look like v0.2.6+20261109-av.1: upstream's version and the date of
# the upstream commit, then our packaging release. Linux builds are glibc,
# made in ubuntu:22.04 (SDL loads the system's sound library at run time);
# macOS builds both architectures on one runner. SDL2 and SDL2_mixer are
# built from source without video and linked statically everywhere
# (asciiverse/build.sh). Windows (x86_64-pc-windows-gnu) is built with
# MSYS2 and tested in a Windows console by windows.yml, called from here.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to build and release"
        required: true

env:
  ID: zorbash
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-24.04, arch: amd64 }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build
        run: |
          docker run --rm -v "$PWD":/src -w /src ubuntu:22.04 sh asciiverse/build.sh
          sudo chown -R "$(id -u):$(id -g)" .
          file zorbash
          ldd zorbash

      - name: Package for av
        run: |
          sh asciiverse/stage.sh
          mkdir -p dist
          tar -czf "dist/$ID-${{ matrix.target }}.tar.gz" -C stage .

      - name: System packages
        run: |
          v="${TAG#v}"; export VERSION="${v%%-av.*}" RELEASE="${v##*-av.}" ARCH="${{ matrix.arch }}"
          for p in deb rpm archlinux; do
            docker run --rm -u "$(id -u):$(id -g)" -v "$PWD":/src -w /src \
              -e VERSION -e RELEASE -e ARCH goreleaser/nfpm:v2.43.0 \
              package --config asciiverse/nfpm.yaml --packager "$p" --target dist/
          done
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-apple-darwin, arch: x86_64 }
          - { target: aarch64-apple-darwin, arch: arm64 }
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build
        run: |
          command -v pkg-config >/dev/null || brew install pkg-config
          CC_ARCH=${{ matrix.arch }} sh asciiverse/build.sh
          file zorbash
          otool -L zorbash

      - name: Package
        run: |
          sh asciiverse/stage.sh
          mkdir -p dist
          tar -czf "dist/$ID-${{ matrix.target }}.tar.gz" -C stage .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  windows:
    uses: ./.github/workflows/windows.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}

  release:
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "Zorbash $TAG" \
                 --notes "Zorbash ${TAG%%-av.*}, the terminal edition, built for the Asciiverse catalog: Linux, macOS and Windows, with .deb, .rpm and Arch packages. See PATCHES.md and UPSTREAM.md."
          gh release upload "$TAG" dist/* -R "$GITHUB_REPOSITORY" --clobber
